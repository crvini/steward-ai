    <!--
      Plus Jakarta Sans para texto; Archivo para montos y títulos. Archivo es
      variable en el eje wdth, y el diseño lo pide entre 112% y 120%, así que
      se pide ese rango y no una instancia fija.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..120,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!--
      PayPal JavaScript SDK v6. Sandbox host for the hackathon demo; swap to
      https://www.paypal.com/web-sdk/v6/core for live. It fires a
      `paypal-web-sdk-loaded` event on window when it is ready.
    -->
    <script async src="https://www.sandbox.paypal.com/web-sdk/v6/core"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
