services:
  db:
    image: postgres:16-alpine
    container_name: steward-ai-db
    restart: unless-stopped
    # Port 5433 on the host so it is free: 5432 is the local PostgreSQL and 5433 is already taken.
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
      POSTGRES_DB: steward_ai
    volumes:
      - steward-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steward -d steward_ai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  steward-db-data:
